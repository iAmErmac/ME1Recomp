# XenonRecomp config for Mass Effect (X360, title 4D5307E8, media 572BA75D, XEX 0.0.0.5,
# kernel 2.0.5766, default.xex sha256 4beb5825...). Modeled on DAORecomp's config/DAO.toml.
# Run from this folder (XenonRecomp prefixes the config's directory to relative paths): the game
# is extracted to ../../game (next to this checkout) and the code goes to ../../ppc.
[main]
file_path = "../../game/default.xex"
out_directory_path = "../../ppc"
switch_table_file_path = "ME1_switch_tables.toml"

# Optimizations stay off until the recompilation runs correctly (as DAO).
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

